[workspace]
members = ["engine", "bindings", "importer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
mod_module_files = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"
